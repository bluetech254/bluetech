# fly.toml app configuration file generated for bluetech-backend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bluetech-backend'
primary_region = 'jnb'  # Johannesburg (closest to Kenya)

[build]
  [build.args]
    PYTHON_VERSION = "3.11"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
