name: CI

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

jobs:

  # ── Backend checks ──────────────────────────────────────────────────────────

  backend-lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff
        run: ruff check backend/app/
        # Non-zero exit = lint errors = job fails = merge blocked

  backend-security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit==1.7.10

      - name: Run bandit
        run: |
          bandit -r backend/app/ \
            --severity-level medium \
            --confidence-level medium \
            --exclude backend/app/core/security.py \
            -q

  backend-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check all .py files parse cleanly
        run: |
          python3 -c "
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk('backend/app'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          with open(path) as fh:
                              ast.parse(fh.read())
                      except SyntaxError as e:
                          errors.append(f'{path}: {e}')
          if errors:
              print('SYNTAX ERRORS:')
              for e in errors: print(e)
              sys.exit(1)
          print(f'All Python files parse cleanly')
          "

  backend-deps-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit dependencies
        run: |
          pip-audit -r backend/requirements.txt \
            --ignore-vuln GHSA-wfm5-v35h-vwf4 \
            --ignore-vuln PYSEC-2026-1325
        # GHSA-wfm5-v35h-vwf4: python-jose known advisory, acceptable
        # PYSEC-2026-1325: ecdsa transitive dep via python-jose, no fix version available

  # ── Frontend (client) checks ────────────────────────────────────────────────

  frontend-typecheck:
    name: Frontend TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: TypeScript type check
        working-directory: client
        run: node_modules/.bin/tsc --noEmit

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.fixit-bluetechnology.co.ke/api/v1
          VITE_APP_NAME: BlueTech

  # ── Admin checks ─────────────────────────────────────────────────────────────

  admin-build:
    name: Admin build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build
        working-directory: admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.fixit-bluetechnology.co.ke

  # ── Secret scanning ──────────────────────────────────────────────────────────

  secrets-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
