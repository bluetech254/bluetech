name: CI

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

jobs:

  # ── Backend checks ──────────────────────────────────────────────────────────

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff
        run: ruff check backend/app/

  backend-types:
    name: Backend type check (mypy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mypy and dependencies
        run: |
          pip install mypy==1.11.2
          pip install -r backend/requirements.txt

      - name: Run mypy (informational only)
        run: |
          mypy backend/app/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --warn-return-any \
            || echo "⚠️ Type hints needed but not blocking merge"

  backend-security:
    name: Backend security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit==1.7.10

      - name: Run bandit
        run: |
          bandit -r backend/app/ \
            --severity-level medium \
            --confidence-level medium \
            --exclude backend/app/core/security.py \
            -q

  backend-syntax:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check all .py files parse cleanly
        run: |
          python3 -c "
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk('backend/app'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          with open(path) as fh:
                              ast.parse(fh.read())
                      except SyntaxError as e:
                          errors.append(f'{path}: {e}')
          if errors:
              print('SYNTAX ERRORS:')
              for e in errors: print(e)
              sys.exit(1)
          print(f'All Python files parse cleanly')
          "

  backend-complexity:
    name: Backend complexity check (radon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install radon
        run: pip install radon==6.0.1

      - name: Check cyclomatic complexity
        run: |
          radon cc backend/app/ --min C --show-complexity
          # Exit 0 for now — just show high complexity functions
          # Change --min to B or A to enforce stricter limits

  backend-deps-audit:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit dependencies
        run: |
          pip-audit -r backend/requirements.txt \
            --ignore-vuln GHSA-wfm5-v35h-vwf4 \
            --ignore-vuln GHSA-3qf3-8w2g-rqmx \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-2263 \
            --ignore-vuln PYSEC-2026-3455 \
            --ignore-vuln PYSEC-2026-3456 \
            --ignore-vuln PYSEC-2026-3457

  # ── Frontend (client) checks ────────────────────────────────────────────────

  frontend-typecheck:
    name: Frontend TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: TypeScript type check
        working-directory: client
        run: npm run lint

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run eslint
        working-directory: client
        run: npx eslint src --ext .ts,.tsx --max-warnings 0 || true
        # || true for now — just show warnings, don't fail
        # Remove || true once codebase is clean

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.fixit-bluetechnology.co.ke/api/v1
          VITE_APP_NAME: BlueTech
          VITE_PAYSTACK_PUBLIC_KEY: pk_test_placeholder

  # ── Admin checks ─────────────────────────────────────────────────────────────

  admin-typecheck:
    name: Admin TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: TypeScript check
        working-directory: admin
        run: node_modules/.bin/tsc --noEmit

  admin-lint:
    name: Admin lint (Next.js eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Install eslint (if missing)
        working-directory: admin
        run: npm install --save-dev eslint || true

      - name: Run Next.js lint
        working-directory: admin
        run: npm run lint || true

  admin-build:
    name: Admin build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build
        working-directory: admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.fixit-bluetechnology.co.ke

  # ── Secret scanning ──────────────────────────────────────────────────────────

  secrets-hardcoded:
    name: Scan for hardcoded credentials (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grep for hardcoded secrets
        run: |
          echo "Scanning for hardcoded credentials..."
          # Patterns to catch: actual JWT tokens (not comments), actual API keys, passwords in code
          FOUND=0
          
          # JWT tokens (actual tokens, not comments mentioning them)
          if grep -rn "eyJhbGciOiJIUzI1NiIs" \
            --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=venv \
            --exclude-dir=dist --exclude-dir=build --exclude-dir=".next" \
            --exclude="*.example" . 2>/dev/null | grep -v "__pycache__" | grep -v "# " | grep -v "//"; then
            FOUND=1
          fi
          
          # AWS keys (AKIA prefix)
          if grep -rn "AKIA[0-9A-Z]\{16\}" \
            --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=venv \
            --exclude-dir=dist --exclude-dir=build --exclude-dir=".next" \
            --exclude="*.example" . 2>/dev/null | grep -v "__pycache__"; then
            FOUND=1
          fi
          
          # Actual hardcoded passwords (password = "..." not in comments)
          if grep -rn 'password\s*=\s*["\x27][a-zA-Z0-9!@#$%^&*]\{8,\}["\x27]' \
            --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=venv \
            --exclude-dir=dist --exclude-dir=build --exclude-dir=".next" \
            --exclude="*.example" . 2>/dev/null | grep -v "__pycache__" | grep -v "// " | grep -v "# "; then
            FOUND=1
          fi
          
          if [ $FOUND -eq 1 ]; then
            echo "❌ Hardcoded credentials found."
            exit 1
          fi
          
          echo "✅ No hardcoded credentials detected"

  secrets-scan:
    name: Scan for leaked secrets (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # ── Compliance checks ────────────────────────────────────────────────────────

  compliance-check:
    name: Compliance check (no secrets in repo, DEBUG=False in prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure no .env files committed
        run: |
          echo "Checking for committed .env files..."
          if find . -name ".env" -not -path "./node_modules/*" -not -path "./.git/*" | grep -q .; then
            echo "❌ .env file(s) found in repository:"
            find . -name ".env" -not -path "./node_modules/*" -not -path "./.git/*"
            echo "These should be in .gitignore and never committed."
            exit 1
          fi
          echo "✅ No .env files committed"

      - name: Check DEBUG is not True in production config files
        run: |
          echo "Checking for DEBUG=True in production configs..."
          # Only check for actual assignments, not comments
          if grep -n "^\s*DEBUG\s*:\s*bool\s*=\s*True" backend/app/core/config.py; then
            echo "❌ DEBUG defaults to True in config.py"
            echo "Change to: DEBUG: bool = False"
            exit 1
          fi
          echo "✅ DEBUG not hardcoded to True in production config"

      - name: Check no TODO or FIXME markers in critical files
        run: |
          echo "Checking for TODO/FIXME in auth and payments..."
          CRITICAL_DIRS="backend/app/auth backend/app/payments backend/app/admin_auth"
          if grep -rn "TODO\|FIXME" $CRITICAL_DIRS 2>/dev/null; then
            echo "⚠️  TODO/FIXME found in critical code paths"
            echo "These should be resolved before production deployment"
            # Don't fail — just warn for now
          else
            echo "✅ No unresolved TODOs in critical paths"
          fi
