name: Database Backup

# Run every Sunday at 2 AM UTC (fits between low-traffic windows across timezones)
# Adjust the schedule cron expression if needed:
# Format: minute hour day(month) month day(week)
# 0 2 * * 0 = Sunday at 02:00 UTC
on:
  schedule:
    - cron: '0 2 * * 0'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  backup:
    name: Backup Supabase Database
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create backup directory
        run: mkdir -p ./backups

      - name: Dump database via pg_dump
        env:
          # Supabase provides a direct PostgreSQL connection URL
          # Format: postgresql://user:password@host:port/database
          # Get it from: Supabase Dashboard → Project Settings → Database → Connection String
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Generate timestamp for backup filename
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="./backups/bluetech_db_${TIMESTAMP}.sql"
          
          echo "Starting database dump at $(date)"
          echo "Target file: ${BACKUP_FILE}"
          
          # Perform the dump with error handling
          if pg_dump \
            --verbose \
            --no-password \
            --no-owner \
            --no-privileges \
            --format=plain \
            --compress=9 \
            "${DATABASE_URL}" > "${BACKUP_FILE}"; then
            
            echo "✅ Database dump completed successfully"
            echo "File size: $(du -h ${BACKUP_FILE} | cut -f1)"
            ls -lh "${BACKUP_FILE}"
          else
            echo "❌ Database dump failed"
            exit 1
          fi

      - name: Upload backup as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup
          path: ./backups/bluetech_db_*.sql
          retention-days: 30
          if-no-files-found: error

      - name: Notify backup status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Backup completed and uploaded to GitHub Actions artifacts"
            echo "   Retention: 30 days"
            echo "   Location: GitHub Actions → Database Backup → Artifacts"
          else
            echo "❌ Backup failed. Check logs above for details."
            exit 1
          fi

