name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Build & FTP Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build for production
        working-directory: client
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.fixit-bluetechnology.co.ke/api/v1
          VITE_APP_NAME: BlueTech

      - name: Add .htaccess for React Router
        run: |
          cat > client/dist/.htaccess << 'EOF'
          Options -MultiViews
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteRule ^ index.html [QSA,L]
          EOF

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./client/dist/
          server-dir: /frontend/
          exclude: |
            **/.git*
            **/.git*/**
