name: Deploy Backend to cPanel

on:
  workflow_run:
    workflows: ["CI"]
    branches: [production]
    types: [completed]

jobs:
  deploy:
    name: FTP Deploy Backend
    runs-on: ubuntu-latest
    # Only run if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./backend/
          server-dir: /backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/*.pyc
            **/*.pyo
            **/backend_test.log
            **/backend.log
            **/server.log
            **/backend.pid
            **/.env
            **/tests/**
            **/Dockerfile
            **/fly.toml
            **/.dockerignore
