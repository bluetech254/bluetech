name: Deploy Admin to cPanel

on:
  push:
    branches: [production]

jobs:
  deploy:
    name: Build & FTP Deploy Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build static export
        working-directory: admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.fixit-bluetechnology.co.ke
          NEXT_PUBLIC_BUSINESS_NAME: Fixit Blue Technology
          NEXT_PUBLIC_BUSINESS_ADDRESS: Nairobi CBD
          NEXT_PUBLIC_BUSINESS_EMAIL: info@fixit-bluetechnology.co.ke
          NEXT_PUBLIC_BUSINESS_PHONE: "+254 707 454182"
          NEXT_PUBLIC_BUSINESS_TAGLINE: "Your trusted repair & tech partner — fast, honest, professional."

      - name: Add .htaccess for client-side routing
        run: |
          cat > admin/out/.htaccess << 'EOF'
          Options -MultiViews
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteRule ^ index.html [QSA,L]
          EOF

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./admin/out/
          server-dir: /Admin/
          exclude: |
            **/.git*
            **/.git*/**
