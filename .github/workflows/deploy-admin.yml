name: Deploy Admin to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Build & FTP Deploy Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build Next.js standalone
        working-directory: admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.fixit-bluetechnology.co.ke

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-admin

          # Next.js standalone output is a self-contained server
          # The entry point is server.js at the root of standalone/
          cp -r admin/.next/standalone/. deploy-admin/

          # Copy static assets into correct location expected by standalone server
          mkdir -p deploy-admin/.next/static
          cp -r admin/.next/static/. deploy-admin/.next/static/

          # Copy public folder
          mkdir -p deploy-admin/public
          cp -r admin/public/. deploy-admin/public/

          # Verify server.js exists
          ls -la deploy-admin/server.js

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deploy-admin/
          server-dir: /Admin/
          exclude: |
            **/.git*
            **/.git*/**
