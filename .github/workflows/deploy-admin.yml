name: Deploy Admin to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Build & FTP Deploy Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build Next.js
        working-directory: admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.fixit-bluetechnology.co.ke

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-admin

          # Upload the built .next output
          cp -r admin/.next deploy-admin/.next

          # Upload public assets
          cp -r admin/public deploy-admin/public

          # Upload package files — cPanel uses these for "Run NPM Install"
          cp admin/package.json deploy-admin/package.json
          cp admin/package-lock.json deploy-admin/package-lock.json

          # Optional config files needed at runtime
          cp admin/next.config.js deploy-admin/next.config.js

          # Create a startup script — cPanel startup file must be a .js file.
          # This just invokes `next start` via the locally installed next binary.
          cat > deploy-admin/server.js << 'EOF'
process.chdir(__dirname);
process.env.NODE_ENV = 'production';

const { createServer } = require('http');
const { parse } = require('url');
const next = require('next');

const port = parseInt(process.env.PORT || '3000', 10);
const app = next({ dev: false, dir: __dirname });
const handle = app.getRequestHandler();

app.prepare().then(() => {
  createServer((req, res) => {
    const parsedUrl = parse(req.url, true);
    handle(req, res, parsedUrl);
  }).listen(port, '0.0.0.0', () => {
    console.log(`Admin ready on port ${port}`);
  });
});
EOF

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deploy-admin/
          server-dir: /Admin/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
