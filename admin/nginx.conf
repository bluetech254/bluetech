server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export: each route is a .html file
    # Try exact file, then route.html, then directory index, then 404
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Never cache the HTML shells (RSC payloads change on deploy)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Next.js hashed assets — cache aggressively
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Other static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
